site_name: Hesperus Ivy
site_description: Equinox-first portable ML primitives and transpilation
site_url: https://hesperus-labs.github.io/Ivy/
repo_name: Hesperus-Labs/Ivy
repo_url: https://github.com/Hesperus-Labs/Ivy
edit_uri: edit/main/docs-site/docs/
docs_dir: docs-site/docs
strict: true

theme:
  name: material
  language: en
  custom_dir: docs-site/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Use light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [ivy]
          options:
            docstring_style: numpy
            members_order: source
            show_source: false
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - tables

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hesperus-Labs/Ivy

copyright: Copyright &copy; 2026 Hesperus Labs · Apache-2.0

