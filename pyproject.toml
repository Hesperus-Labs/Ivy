[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hesperus-ivy"
version = "2.0.0a1"
description = "Portable, Equinox-first ML primitives and source-to-source transpilation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aadesh Kumar", email = "25KumarAadesh@gmail.com" }]
maintainers = [{ name = "Hesperus Labs" }]
keywords = ["machine learning", "transpiler", "jax", "equinox", "pytorch", "tensorflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "astor>=0.8.1,<0.9",
  "astunparse>=1.6,<2",
  "cloudpickle>=3,<4",
  "colorama>=0.4.6,<1",
  "cryptography>=42,<47",
  "dill>=0.3.8,<0.4",
  "diskcache>=5.6,<6",
  "einops>=0.8,<1",
  "filelock>=3.15,<4",
  "gast>=0.6,<1",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "ml-dtypes>=0.5,<1",
  "packaging>=24,<26",
  "platformdirs>=4.2,<5",
  "psutil>=6,<8",
  "requests>=2.32,<3",
  "termcolor>=2.4,<4",
  "tqdm>=4.66,<5",
  "typing_extensions>=4.12,<5",
]

[project.optional-dependencies]
torch = ["torch>=2.13,<2.14"]
tensorflow = ["tensorflow>=2.21,<2.22"]
jax = [
  "jax>=0.11,<0.12",
  "equinox>=0.13.8,<0.14",
  "optax>=0.2.8,<0.3",
]
all-cpu = [
  "torch>=2.13,<2.14",
  "tensorflow>=2.21,<2.22",
  "jax>=0.11,<0.12",
  "equinox>=0.13.8,<0.14",
  "optax>=0.2.8,<0.3",
]
nvidia = [
  "torch>=2.13,<2.14",
  "jax[cuda13]>=0.11,<0.12",
  "equinox>=0.13.8,<0.14",
  "optax>=0.2.8,<0.3",
  "tensorflow[and-cuda]>=2.21,<2.22",
  "nvidia-ml-py>=12,<13",
]

[project.scripts]
ivy = "ivy.cli:main"
ivy-doctor = "ivy.cli:doctor_main"

[project.urls]
Homepage = "https://github.com/Hesperus-Labs/Ivy"
Documentation = "https://hesperus-labs.github.io/Ivy/"
Repository = "https://github.com/Hesperus-Labs/Ivy"
Issues = "https://github.com/Hesperus-Labs/Ivy/issues"

[tool.hatch.version]
path = "ivy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ivy"]

[tool.hatch.build.targets.sdist]
include = [
  "/ivy",
  "/ivy_tests",
  "/examples",
  "/docs-site",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "pre-commit>=3.7,<5",
  "pyright>=1.1.380,<2",
  "ruff>=0.9,<1",
]
test = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
docs = [
  "griffe>=1.5,<2",
  "jupyter>=1,<2",
  "mike>=2.1,<3",
  "mkdocs-gen-files>=0.5,<1",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.27,<1",
  "nbformat>=5.10,<6",
]

[tool.uv]
default-groups = ["dev", "test"]
conflicts = [
  [{ extra = "all-cpu" }, { extra = "nvidia" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Keep CPU and CUDA wheels explicit.  The conflict declaration above prevents
# uv from trying to solve both accelerator stacks in one environment.
torch = [
  { index = "pytorch-cpu", extra = "all-cpu" },
  { index = "pytorch-cu130", extra = "nvidia" },
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["ivy_tests", "docs-site/site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E203", "E402", "E501"]

[tool.pyright]
include = ["ivy/transpiler"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportAssignmentType = false
reportCallIssue = false
reportGeneralTypeIssues = false
reportOptionalMemberAccess = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "requires_torch: requires the PyTorch extra",
  "requires_tensorflow: requires the TensorFlow extra",
  "requires_jax: requires the JAX/Equinox extra",
]
