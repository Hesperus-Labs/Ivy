repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(ivy/transpiler|ivy/stateful/equinox\.py|ivy/cli\.py|tests|examples)/
      - id: ruff-format
        files: ^(ivy/transpiler|ivy/stateful/equinox\.py|ivy/cli\.py|tests|examples)/
