name: 📚 Documentation Bug Report
description: Report an issue in the current Hesperus Ivy documentation.
title: "[Documentation]: <TITLE>"
labels: [documentation]
assignees: []
body:
  - type: input
    id: url
    attributes:
      label: Page or repository path
      description: Link to the Pages page or the source Markdown path.
      placeholder: https://hesperus-labs.github.io/Ivy/tutorials/internals/
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section
      description: Section of the documentation containing the issue.
      placeholder: e.g. Internal tutorial / primitive registry
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What is incorrect, missing, or unclear?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should the page say or demonstrate?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add screenshots, build output, or a broken-link URL if useful.
