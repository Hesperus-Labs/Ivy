name: 🐛 Bug Report
description: File a bug in the current Hesperus Ivy contract.
title: "[Bug]: <TITLE>"
labels: "bug"
body:
  - type: textarea
    id: explanation
    attributes:
      label: Bug explanation
      description: What happened, and what did you expect to happen?
      placeholder: e.g. torch.matmul lowers to an incorrect JAX result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small runnable example and the report JSON when applicable.
      placeholder: "e.g. Run the following code:"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python, framework versions, and installation command.
      placeholder: e.g. Ubuntu 24.04, Python 3.13, CUDA 13, RTX 4060, Git main.
    validations:
      required: true
  - type: input
    id: hesperus_ivy_version
    attributes:
      label: Hesperus Ivy version
      description: Which Hesperus Ivy version, Git revision, or editable checkout are you using?
      placeholder: ex. 2.0.0a1 or main@<commit>
    validations:
      required: true
  - type: checkboxes
    id: backend
    attributes:
      label: Frameworks or targets
      description: Select the affected framework(s), if known.
      options:
        - label: NumPy
        - label: TensorFlow
        - label: PyTorch
        - label: JAX / Equinox
  - type: input
    id: device
    attributes:
      label: Device
      description: What device did you encounter the bug on?
      placeholder: "GPU: NVIDIA GeForce RTX 4060 or CPU"
