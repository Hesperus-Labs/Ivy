name: Hesperus Ivy quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }} --extra all-cpu
      - run: uv run --python ${{ matrix.python-version }} ruff check ivy/transpiler ivy/stateful/equinox.py ivy/cli.py tests
      - run: uv run --python ${{ matrix.python-version }} pyright
      - run: uv run --python ${{ matrix.python-version }} pytest tests --cov=ivy.transpiler --cov-report=term-missing
      - run: uv run --python ${{ matrix.python-version }} python examples/transpile_torch_to_numpy.py
      - run: uv run --python ${{ matrix.python-version }} python examples/transpile_tensorflow_to_numpy.py
      - run: uv run --python ${{ matrix.python-version }} python examples/transpile_ivy_to_numpy.py
      - run: uv run --python ${{ matrix.python-version }} python examples/equinox_module.py
      - run: uv build

  docs:
    name: Strict documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true
      - run: uv sync --python 3.12 --group docs
      - run: uv run --python 3.12 --group docs mkdocs build --strict

  git-install:
    name: Git install smoke test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
      - run: uv build
      - run: uv venv --python 3.12 .smoke-venv
      - run: uv pip install --python .smoke-venv/bin/python dist/hesperus_ivy-*.whl
      - run: .smoke-venv/bin/python -c "import ivy; print(ivy.__version__)"
